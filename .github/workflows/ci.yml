name: TalkieTalkie CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate JSON Schema and examples
        run: |
          python -m json.tool schema/message-0.1.schema.json > /dev/null
          python -m json.tool examples/text-message.json > /dev/null
          python -m json.tool examples/file-message.json > /dev/null
          python -m json.tool examples/reaction.json > /dev/null
      - name: Run message-envelope tests
        run: make test
